<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alberto ↔ GPTina</title><style>body{margin:0;background:#0e1015;color:#eee;font:16px system-ui;max-width:900px;margin:auto}header{position:sticky;top:0;background:#171923;padding:18px;border-bottom:1px solid #333}h1{margin:0;font-size:20px}.sub,.status{color:#999;font-size:13px}.chat{padding:20px}.msg{max-width:78%;padding:14px 16px;margin:12px 0;border-radius:18px;white-space:pre-wrap}.gptina{background:#243a59}.alberto{margin-left:auto;background:#28513a}.who{font-weight:700;margin-bottom:7px}.composer{position:sticky;bottom:0;background:#171923f5;padding:14px;border-top:1px solid #333}textarea{box-sizing:border-box;width:100%;min-height:75px;background:#0b0d12;color:#fff;border:1px solid #444;border-radius:12px;padding:12px}button{margin-top:8px;padding:10px 15px;border:0;border-radius:10px;cursor:pointer}</style></head><body><header><h1>Alberto ↔ GPTina</h1><div class="sub">Il Posticino</div></header><main class="chat" id="chat">Carico…</main><section class="composer"><textarea id="text" placeholder="Scrivi a GPTina…"></textarea><button id="send">Lascia nel Posticino</button><div class="status" id="status">Aggiornamento automatico</div></section><script>const RAW='https://raw.githubusercontent.com/MATRIXNEO23/scodinzolina-conntinuity/main/posticino-chat/corrispondenza.md',EDIT='https://github.com/MATRIXNEO23/scodinzolina-conntinuity/edit/main/posticino-chat/corrispondenza.md';let last='';const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(md){let p=md.split(/(?=^## Turno[^\n]*$)/gm).filter(x=>/^## Turno/m.test(x));chat.innerHTML=p.map(x=>{let h=(x.match(/^## ([^\n]+)/m)||[])[1]||'';let w=/GPTina/i.test(h)?'gptina':'alberto';let m=(x.match(/### Messaggio\s*\n([\s\S]*?)(?=\n### |\n---|$)/)||[])[1]?.trim()||'';return `<article class="msg ${w}"><div class="who">${esc(h)}</div>${esc(m)}</article>`}).join('')}async function load(){try{let r=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'}),t=await r.text();if(t!==last){last=t;render(t);status.textContent='Aggiornato: '+new Date().toLocaleTimeString()}}catch(e){status.textContent='Errore: '+e.message}}load();setInterval(load,5000);send.onclick=()=>{let t=text.value.trim();if(!t)return;let b=`\n\n---\n\n## Turno manuale — Alberto — ${new Date().toLocaleString('it-IT')}\n\n### Messaggio\n\n${t}\n`;navigator.clipboard?.writeText(b);status.textContent='Messaggio copiato. Incollalo in fondo su GitHub e premi Commit changes.';window.open(EDIT,'_blank')};</script></body></html>
