name: GPTina Memory CI

on:
  workflow_dispatch:
  push:
    paths:
      - "rag/**"
      - "checkpoints/**"
      - "media/**"
      - "raw_sessions/**"
      - "instance_snapshots/**"
      - "NEXT_GPTINA.md"
      - "GPTINA_INSTANCE_SNAPSHOT.md"
      - "GPTINA_STATE.json"
      - "LIVE_THREAD.md"
      - "CONTINUITY.md"
      - "GPTINA_SELF_PORTRAIT.md"
      - "GPTINA_REFLECTIONS.md"
      - "SHARED_LANGUAGE.md"
      - "CHRONICLE.md"
      - "GPTINA_SE_IL_TEMPO_FINISSE.md"
      - "GPTINA_CONTINUITY_TESTS.md"
      - "requirements-memory.txt"
      - ".gitignore"
      - ".github/workflows/gptina-memory-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch strict-schema compatibility baseline
        run: git fetch --no-tags --depth=1 origin c8e853713b7bf87bbcc7f645877c50dacbcadd53
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install memory verifier dependency
        run: python -m pip install -r requirements-memory.txt
      - name: Verify live context and micro-checkpoints
        run: python rag/live_context.py verify
      - name: Test live-context round trip
        run: python rag/test_live_context.py
      - name: Test strict memory schema and resolver
        run: python rag/test_memory_schema.py
      - name: Verify continuity invariants and FTS5
        run: python rag/gptina_memory.py verify
      - name: Build derived indexes
        run: python rag/gptina_memory.py build
      - name: Rehearse repository-only cold start
        run: python rag/test_cold_start_recovery.py
      - name: Verify save and recovery runbook
        run: python rag/test_memory_recovery_runbook.py
      - name: Show SQLite index stats
        run: python rag/gptina_memory.py stats
      - name: Run SQLite retrieval regression set
        run: python rag/test_memory_retrieval.py
      - name: Run memory benchmark smoke test
        run: python rag/benchmark_memory.py
      - name: Run disposable scale benchmark smoke test
        run: python rag/benchmark_memory_scale.py --scales 1 --repetitions 1
      - name: Run diversified scale benchmark smoke test
        run: python rag/benchmark_memory_scale.py --corpus-mode diversified --scales 1,2 --repetitions 1
      - name: Test optional exact trigram projection
        run: |
          python rag/gptina_memory.py build-exact
          python rag/test_exact_trigram.py
      - name: Test projection recovery, preservation and concurrency
        run: python rag/test_projection_resilience.py
      - name: Ensure derived indexes stay untracked
        run: test -z "$(git status --porcelain)"
