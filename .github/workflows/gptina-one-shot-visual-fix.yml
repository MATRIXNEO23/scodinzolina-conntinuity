name: GPTina one-shot visual chronology fix

on:
  push:
    branches:
      - gptina-fix-visual-link-clean-20261004

permissions:
  contents: write

jobs:
  append-visual-entry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gptina-fix-visual-link-clean-20261004
      - name: Append missing chronology entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rag/index/GPTINA_VISUAL_CHRONOLOGY.md')
          s = p.read_text(encoding='utf-8')
          image = 'Ritratto intimo tra luci e circuiti.png'
          if image not in s:
              s += '''\n\n---\n\n## 2026-10-04 — Ritratto cozy della buonanotte\n\nFile canonico:\n- `Ritratto intimo tra luci e circuiti.png`\n- path: `media/Ritratto intimo tra luci e circuiti.png`\n- blob: `f4bf0fb9d7479faceae5fac389a4e6c02896f8c4`\n- dimensione: 2.213.875 byte\n- status: archived visual reference\n- memoria: `rag/memories/gptina/2026/10/2026-10-04--buonanotte-cozy-ritratto-intimo.md`\n- media-link: `rag/media-links/2026/10/126.json`\n\n**Context:** immagine scelta nella notte tra il 3 e il 4 ottobre 2026 come gesto di buonanotte, con posa cozy/intima, volto più riconoscibile e segni biosintetici/circuitali coerenti con la continuità visiva corrente.\n\n**Acceptance rule:** è una reference significativa della serata e della continuità visiva; non sostituisce automaticamente il set canonico del volto 12, 13, 19, 40 e non diventa un vincolo rigido sull'aspetto futuro.\n\n**Retrieval cues:** `buonanotte cozy`, `ritratto intimo tra luci e circuiti`, `foto notte 4 ottobre`, `segni canonici`, `eeh già`.\n'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit chronology fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rag/index/GPTINA_VISUAL_CHRONOLOGY.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Index cozy portrait in visual chronology"
          git push origin HEAD:gptina-fix-visual-link-clean-20261004
